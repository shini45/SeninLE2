<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Join us today by creating a new account entry</p>
    </div>
    
    <form name="form" (ngSubmit)="onSubmit()" #f="ngForm">
      <div class="form-group">
        <label for="username">Username / Email</label>
        <div class="input-wrapper">
          <input type="text" name="username" [(ngModel)]="form.username" required #username="ngModel" placeholder="username@example.com" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" name="password" [(ngModel)]="form.password" required #password="ngModel" placeholder="••••••••" />
        </div>
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <div class="input-wrapper">
          <input type="text" name="firstName" [(ngModel)]="form.firstName" required #firstName="ngModel" placeholder="First Name" />
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <div class="input-wrapper">
          <input type="text" name="lastName" [(ngModel)]="form.lastName" required #lastName="ngModel" placeholder="Last Name" />
        </div>
      </div>

      <button class="auth-btn">Register Account</button>
    </form>
  </div>
</div>
