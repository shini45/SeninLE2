<div class="directory-control">
  <div class="results-counter">
    <h2>{{ filteredPosts.length }} articles found</h2>
  </div>
  
  <div class="search-filter-wrapper">
    <div class="search-box">
      <input type="text" [(ngModel)]="searchQuery" (input)="onSearch()" placeholder="Search title or author..." />
      <button class="search-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </div>
    
    <button class="filter-trigger-btn" (click)="toggleFilter()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
      Sort: {{ isDescending ? 'Newest' : 'Oldest' }}
    </button>
  </div>
</div>

<div class="blog-grid">
  <div class="blog-card" *ngFor="let post of displayedPosts">
    <div class="blog-card-body">
      <h3 class="blog-title">
        <a href="/posts/{{ post.id }}">{{ post.title }}</a>
      </h3>
      <div class="blog-meta">
        <span class="meta-author">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          by {{ post.firstName }} {{ post.lastName }}
        </span>
        <span class="meta-date">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          {{ post.dateCreated | date:'mediumDate' }}
        </span>
      </div>
      <p class="blog-excerpt">Click the article headline link above to explore the absolute data body rendering information within our active cloud channel endpoints nodes.</p>
    </div>
  </div>
</div>

<div class="pagination-container" *ngIf="filteredPosts.length > pageSize">
  <button class="page-nav-btn" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">&lsaquo; Prev</button>
  <button class="page-number-btn" [class.active]="currentPage === 1" (click)="changePage(1)">1</button>
  <button class="page-number-btn" *ngIf="filteredPosts.length > pageSize" [class.active]="currentPage === 2" (click)="changePage(2)">2</button>
  <button class="page-nav-btn" (click)="changePage(currentPage + 1)" [disabled]="currentPage * pageSize >= filteredPosts.length">Next &rsaquo;</button>
</div>
